<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  </head>

  <body>
    <div class="wrapper">

      <!-- HEADER -->
      <header class="site-header">
        <h1 class="site-title">{{ site.title }}</h1>

        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="Profile photo">
        {% endif %}

        <div class="social-links">
          <div>
            <strong>GitHub:</strong>
            <a href="https://github.com/chenguangduan" target="_blank">
              github.com/chenguangduan
            </a>
          </div>

          <div>
            <strong>Google Scholar:</strong>
            <a href="https://scholar.google.com/citations?user=RpmGgyMAAAAJ" target="_blank">
              RpmGgyMAAAAJ
            </a>
          </div>

          <div>
            <strong>ORCID:</strong>
            <a href="https://orcid.org/0009-0009-0815-6281" target="_blank">
              0009-0009-0815-6281
            </a>
          </div>
          
        </div>
      </header>

      <!-- MAIN CONTENT -->
      <section>
        {{ content }}
      </section>

    </div>
  </body>
</html>
