<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

        <div class="social-links">
          <div>
            <strong>GitHub:</strong>

            <strong>ORCID:</strong>
            <a href="https://orcid.org/0000-0000-0000-0000" target="_blank">
              0000-0000-0000-0000
            </a>
          </div>

          <div>
            <strong>Email:</strong>
            chenguang.duan@your-university.edu

      <!-- PAGE CONTENT -->

    </div>

</html>
